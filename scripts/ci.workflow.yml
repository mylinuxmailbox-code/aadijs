name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run Ecosystem Test Suite
        run: bun test
      - name: Run Node.js Compatibility Probes
        run: bun packages/cli/bin/aadi.ts compat
      - name: Run Benchmarks
        if: matrix.os != 'windows-latest'
        run: bun benchmarks/run.ts
